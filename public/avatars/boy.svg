<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="#e8f5e9" stroke="#2d7a3e" stroke-width="3"/>
  
  <!-- Tree leaves - background -->
  <g id="leaves">
    <!-- Top center large leaf -->
    <ellipse cx="100" cy="35" rx="18" ry="28" fill="#6ba82a" transform="rotate(0 100 35)"/>
    <path d="M 100 20 Q 95 35 100 50" stroke="#9ccc65" stroke-width="1.5" fill="none"/>
    
    <!-- Upper left leaves -->
    <ellipse cx="65" cy="50" rx="14" ry="22" fill="#7cb342" transform="rotate(-35 65 50)"/>
    <path d="M 65 35 Q 62 48 68 58" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Upper right leaves -->
    <ellipse cx="135" cy="50" rx="14" ry="22" fill="#7cb342" transform="rotate(35 135 50)"/>
    <path d="M 135 35 Q 138 48 132 58" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Middle left leaves -->
    <ellipse cx="45" cy="80" rx="12" ry="20" fill="#8bc34a" transform="rotate(-50 45 80)"/>
    <path d="M 45 65 Q 40 78 50 92" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Middle right leaves -->
    <ellipse cx="155" cy="80" rx="12" ry="20" fill="#8bc34a" transform="rotate(50 155 80)"/>
    <path d="M 155 65 Q 160 78 150 92" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Lower middle leaves -->
    <ellipse cx="75" cy="100" rx="13" ry="18" fill="#7cb342" transform="rotate(-25 75 100)"/>
    <ellipse cx="125" cy="100" rx="13" ry="18" fill="#7cb342" transform="rotate(25 125 100)"/>
  </g>
  
  <!-- Tree trunk -->
  <rect x="92" y="85" width="16" height="35" fill="#6d4c41" rx="2"/>
  
  <!-- Boy's head -->
  <circle cx="100" cy="75" r="22" fill="#f4a460"/>
  
  <!-- Boy's hair -->
  <ellipse cx="100" cy="65" rx="24" ry="20" fill="#3d3d3d"/>
  <path d="M 80 70 Q 75 60 85 55" fill="#3d3d3d"/>
  <path d="M 120 70 Q 125 60 115 55" fill="#3d3d3d"/>
  
  <!-- Eyes -->
  <circle cx="93" cy="72" r="3" fill="#000"/>
  <circle cx="107" cy="72" r="3" fill="#000"/>
  <circle cx="93.5" cy="70.5" r="1.2" fill="#fff"/>
  <circle cx="107.5" cy="70.5" r="1.2" fill="#fff"/>
  
  <!-- Smile -->
  <path d="M 93 82 Q 100 87 107 82" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Boy's shirt -->
  <rect x="78" y="105" width="44" height="40" fill="#e8f5f5" rx="3"/>
  <rect x="85" y="110" width="8" height="12" fill="#1e3a8a"/> <!-- Left collar -->
  <rect x="107" y="110" width="8" height="12" fill="#1e3a8a"/> <!-- Right collar -->
  
  <!-- Tie -->
  <rect x="97" y="115" width="6" height="18" fill="#1e3a8a" rx="2"/>
  <path d="M 94 123 L 100 130 L 106 123" fill="#1e3a8a"/>
  
  <!-- Buttons -->
  <circle cx="100" cy="125" r="1.5" fill="#1e3a8a"/>
  <circle cx="100" cy="133" r="1.5" fill="#1e3a8a"/>
  
  <!-- Boy's arms -->
  <rect x="62" y="115" width="12" height="30" fill="#f4a460" rx="4"/>
  <rect x="126" y="115" width="12" height="30" fill="#f4a460" rx="4"/>
  
  <!-- Book -->
  <g transform="translate(50, 125) rotate(-25)">
    <rect x="0" y="0" width="28" height="36" fill="#2d5016" stroke="#1a3a0a" stroke-width="1" rx="2"/>
    <rect x="2" y="2" width="24" height="32" fill="#4a7c2c" rx="1"/>
    <!-- Book pages -->
    <line x1="14" y1="5" x2="14" y2="31" stroke="#2d5016" stroke-width="0.5"/>
    <!-- Text lines on book -->
    <line x1="5" y1="10" x2="24" y2="10" stroke="#d1fae5" stroke-width="0.8"/>
    <line x1="5" y1="15" x2="23" y2="15" stroke="#d1fae5" stroke-width="0.8"/>
    <line x1="5" y1="20" x2="22" y2="20" stroke="#d1fae5" stroke-width="0.8"/>
    <line x1="5" y1="25" x2="21" y2="25" stroke="#d1fae5" stroke-width="0.8"/>
  </g>
</svg>
