<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="#fce4ec" stroke="#c2185b" stroke-width="3"/>
  
  <!-- Tree leaves - background -->
  <g id="leaves">
    <!-- Top center large leaf -->
    <ellipse cx="100" cy="35" rx="18" ry="28" fill="#6ba82a" transform="rotate(0 100 35)"/>
    <path d="M 100 20 Q 95 35 100 50" stroke="#9ccc65" stroke-width="1.5" fill="none"/>
    
    <!-- Upper left leaves -->
    <ellipse cx="65" cy="50" rx="14" ry="22" fill="#7cb342" transform="rotate(-35 65 50)"/>
    <path d="M 65 35 Q 62 48 68 58" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Upper right leaves -->
    <ellipse cx="135" cy="50" rx="14" ry="22" fill="#7cb342" transform="rotate(35 135 50)"/>
    <path d="M 135 35 Q 138 48 132 58" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Middle left leaves -->
    <ellipse cx="45" cy="80" rx="12" ry="20" fill="#8bc34a" transform="rotate(-50 45 80)"/>
    <path d="M 45 65 Q 40 78 50 92" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Middle right leaves -->
    <ellipse cx="155" cy="80" rx="12" ry="20" fill="#8bc34a" transform="rotate(50 155 80)"/>
    <path d="M 155 65 Q 160 78 150 92" stroke="#9ccc65" stroke-width="1" fill="none"/>
    
    <!-- Lower middle leaves -->
    <ellipse cx="75" cy="100" rx="13" ry="18" fill="#7cb342" transform="rotate(-25 75 100)"/>
    <ellipse cx="125" cy="100" rx="13" ry="18" fill="#7cb342" transform="rotate(25 125 100)"/>
  </g>
  
  <!-- Tree trunk -->
  <rect x="92" y="85" width="16" height="35" fill="#6d4c41" rx="2"/>
  
  <!-- Girl's head -->
  <circle cx="100" cy="75" r="22" fill="#fdbcb4"/>
  
  <!-- Girl's hair -->
  <ellipse cx="100" cy="62" rx="26" ry="22" fill="#8b4513"/>
  <path d="M 78 72 Q 70 65 75 55" fill="#8b4513"/>
  <path d="M 122 72 Q 130 65 125 55" fill="#8b4513"/>
  <!-- Hair accent -->
  <ellipse cx="100" cy="58" rx="8" ry="12" fill="#a0522d"/>
  
  <!-- Eyes -->
  <circle cx="93" cy="72" r="3.5" fill="#000"/>
  <circle cx="107" cy="72" r="3.5" fill="#000"/>
  <circle cx="93.5" cy="70.5" r="1.5" fill="#fff"/>
  <circle cx="107.5" cy="70.5" r="1.5" fill="#fff"/>
  <path d="M 90 68 Q 93 66 96 68" stroke="#8b4513" stroke-width="0.5" fill="none"/> <!-- Eyebrow left -->
  <path d="M 104 68 Q 107 66 110 68" stroke="#8b4513" stroke-width="0.5" fill="none"/> <!-- Eyebrow right -->
  
  <!-- Smile -->
  <path d="M 93 83 Q 100 88 107 83" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Girl's dress -->
  <rect x="76" y="105" width="48" height="42" fill="#f0e68c" rx="3"/>
  <path d="M 76 107 L 72 115 L 128 115 L 124 107" fill="#daa520"/>
  
  <!-- Dress pattern -->
  <circle cx="85" cy="120" r="2" fill="#d4af37"/>
  <circle cx="100" cy="120" r="2" fill="#d4af37"/>
  <circle cx="115" cy="120" r="2" fill="#d4af37"/>
  <circle cx="90" cy="132" r="2" fill="#d4af37"/>
  <circle cx="110" cy="132" r="2" fill="#d4af37"/>
  
  <!-- Girl's arms -->
  <rect x="60" y="115" width="12" height="30" fill="#fdbcb4" rx="4"/>
  <rect x="128" y="115" width="12" height="30" fill="#fdbcb4" rx="4"/>
  
  <!-- Book -->
  <g transform="translate(50, 125) rotate(-25)">
    <rect x="0" y="0" width="28" height="36" fill="#c41e3a" stroke="#8b0000" stroke-width="1" rx="2"/>
    <rect x="2" y="2" width="24" height="32" fill="#e74c3c" rx="1"/>
    <!-- Book pages -->
    <line x1="14" y1="5" x2="14" y2="31" stroke="#8b0000" stroke-width="0.5"/>
    <!-- Text lines on book -->
    <line x1="5" y1="10" x2="24" y2="10" stroke="#fff0f5" stroke-width="0.8"/>
    <line x1="5" y1="15" x2="23" y2="15" stroke="#fff0f5" stroke-width="0.8"/>
    <line x1="5" y1="20" x2="22" y2="20" stroke="#fff0f5" stroke-width="0.8"/>
    <line x1="5" y1="25" x2="21" y2="25" stroke="#fff0f5" stroke-width="0.8"/>
  </g>
</svg>
